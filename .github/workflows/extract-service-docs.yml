name: Extract service documents

on:
  push:
    branches:
      - feature/services-content-circumcision

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract text from service documents
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET

          docs_dir = Path("public/images/drm")
          output = []
          ns = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}

          for path in sorted(docs_dir.glob("*.docx")):
              output.append("=" * 90)
              output.append(path.name)
              output.append("=" * 90)
              try:
                  with ZipFile(path) as archive:
                      xml = archive.read("word/document.xml")
                  root = ET.fromstring(xml)
                  for paragraph in root.findall(".//w:p", ns):
                      text = "".join(node.text or "" for node in paragraph.findall(".//w:t", ns)).strip()
                      if text:
                          output.append(text)
              except Exception as exc:
                  output.append(f"[Extraction failed: {exc}]")
              output.append("")

          Path("service-docs-extracted.txt").write_text("\n".join(output), encoding="utf-8")

      - name: Upload extracted text
        uses: actions/upload-artifact@v4
        with:
          name: service-docs-extracted
          path: service-docs-extracted.txt
