name: Seamless navbar redesign

on:
  push:
    branches:
      - feature/seamless-navbar

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seamless-navbar
          fetch-depth: 0

      - name: Refine navbar
        shell: python
        env:
          HEADER_B64: 
        run: |
          from pathlib import Path
          import base64
          import os
          import re

          path = Path('src/DrMukuduHomepage.jsx')
          text = path.read_text(encoding='utf-8')
          header = base64.b64decode(os.environ['HEADER_B64']).decode('utf-8').rstrip()
          pattern = r'function Header\(\) \{.*?\n\}\n\nfunction TrustLogoRail\(\) \{'
          text, count = re.subn(pattern, header + '\n\nfunction TrustLogoRail() {', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Header replacement failed')
          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow
        run: rm -f .github/workflows/seamless-navbar.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit navbar redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DrMukuduHomepage.jsx .github/workflows/seamless-navbar.yml
          git commit -m "style: redesign navbar as seamless navigation"
          git push origin feature/seamless-navbar
