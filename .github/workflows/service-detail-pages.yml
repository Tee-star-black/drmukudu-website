name: Service detail pages

on:
  push:
    branches:
      - feature/service-detail-pages

permissions:
  contents: write

jobs:
  build-service-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/service-detail-pages
          fetch-depth: 0

      - name: Apply service detail pages
        run: python .github/scripts/apply_service_detail_pages.py

      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_service_detail_pages.py
          rm .github/workflows/service-detail-pages.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit service detail pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clinical service detail pages"
          git push origin HEAD:feature/service-detail-pages
