name: Services dropdown navigation

on:
  push:
    branches:
      - feature/services-dropdown-v2

permissions:
  contents: write

jobs:
  update-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/services-dropdown-v2
          fetch-depth: 0

      - name: Apply services dropdown
        run: python .github/scripts/services_dropdown.py

      - name: Remove temporary files
        run: rm -f .github/workflows/services-dropdown.yml .github/scripts/services_dropdown.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DrMukuduHomepage.jsx .github/workflows/services-dropdown.yml .github/scripts/services_dropdown.py
          git commit -m "feat: add services dropdown navigation"
          git push origin feature/services-dropdown-v2
