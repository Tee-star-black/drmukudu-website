name: Clinical Mega Menu Patch

"on":
  push:
    branches:
      - feature/clinical-mega-menu

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clinical-mega-menu
          fetch-depth: 0

      - name: Apply clinical mega menu
        run: python .github/scripts/apply_clinical_mega_menu.py

      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply_clinical_mega_menu.py .github/workflows/clinical-mega-menu.yml .github/workflows/clinical-mega-menu-v2.yml

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit mega menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DrMukuduHomepage.jsx .github
          git commit -m "feat: redesign services as clinical mega menu"
          git push origin feature/clinical-mega-menu
